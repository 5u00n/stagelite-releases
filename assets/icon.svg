<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" />

  <!-- Outer subtle border -->
  <rect x="16" y="16" width="992" height="992" rx="212" fill="none" stroke="#334155" stroke-width="8" stroke-opacity="0.5" />

  <!-- Spotlight beam -->
  <polygon points="512,180 260,780 764,780" fill="url(#beam)" />

  <!-- Hexagonal Stage Prism Logo -->
  <polygon points="512,240 760,380 760,660 512,800 264,660 264,380"
           fill="none" stroke="url(#glow)" stroke-width="48" stroke-linejoin="round"
           filter="url(#shadow)" />

  <!-- Inner core star/light -->
  <circle cx="512" cy="520" r="80" fill="#38bdf8" filter="url(#shadow)" />
  <circle cx="512" cy="520" r="40" fill="#ffffff" />
</svg>
